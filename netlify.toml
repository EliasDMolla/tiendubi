[build]
  base = "capturar-front"
  command = "npm run build"
  publish = "dist/capturar-front/browser"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  # Keep the prerendered landing only for `/`. Client-side routes must start
  # from Angular's empty shell so a public store never flashes the landing.
  to = "/index.csr.html"
  status = 200
