<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Showcase - Catálogo Premium para Revendedores</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-body: 'Inter', sans-serif;
            --font-heading: 'Plus Jakarta Sans', sans-serif;
            --primary: #1e293b;
            --accent: #6366f1;
        }
        
        body { 
            font-family: var(--font-body);
            background-color: #ffffff;
            color: #1e293b;
        }
        h1, h2, h3, h4 { font-family: var(--font-heading); }
        
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Glass effect for navigation */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Hover effect for showcase cards */
        .showcase-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .showcase-card:hover {
            transform: translateY(-8px);
        }
        .showcase-card img {
            transition: transform 0.7s ease;
        }
        .showcase-card:hover img {
            transform: scale(1.05);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <div id="app"></div>

    <script>
        const CONFIG = {
            company: {
                name: "Nova Showcase",
                tagline: "Exclusividad en cada detalle"
            },
            hero: {
                title: "Tu inventario merece una presentación impecable",
                subtitle: "La herramienta definitiva para revendedores de propiedades, vehículos y activos de lujo. Sin precios a la vista, solo la pureza de tus productos.",
                cta: "Comenzar mi catálogo",
            },
            categories: [
                { id: "propiedades", label: "Propiedades" },
                { id: "vehiculos", label: "Vehículos" },
                { id: "activos", label: "Activos de Lujo" }
            ],
            inventory: [
                {
                    category: "propiedades",
                    title: "Villa Contemporánea en la Costa",
                    description: "Arquitectura minimalista con vistas panorámicas al océano y acabados en piedra natural.",
                    image: "https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&q=80&w=1200",
                    tags: ["Exclusivo", "Vistas al Mar"]
                },
                {
                    category: "vehiculos",
                    title: "Gran Turismo Sport",
                    description: "Ingeniería de alto rendimiento combinada con un diseño aerodinámico de vanguardia.",
                    image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1200",
                    tags: ["Limited Edition", "Performance"]
                },
                {
                    category: "propiedades",
                    title: "Penthouse Distrito Financiero",
                    description: "Doble altura, ventanales de piso a techo y una terraza privada en el corazón de la ciudad.",
                    image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80&w=1200",
                    tags: ["City View", "Smart Home"]
                },
                {
                    category: "activos",
                    title: "Cronógrafo de Colección",
                    description: "Maquinaria suiza de precisión histórica y caja de oro rosa de 18 quilates.",
                    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=1200",
                    tags: ["Horología", "Certificado"]
                }
            ],
            ctaSection: {
                title: "¿Listo para elevar tu marca?",
                subtitle: "Personaliza tu catálogo digital hoy mismo y conecta con clientes de alto perfil."
            }
        };

        const renderNav = () => `
            <nav class="fixed top-0 inset-x-0 z-50 glass-nav">
                <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center text-white">
                            <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-slate-900">${CONFIG.company.name}</span>
                    </div>
                    <div class="hidden md:flex items-center gap-8">
                        <a href="#catalogo" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-colors">Catálogo</a>
                        <a href="#soluciones" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-colors">Soluciones</a>
                        <button class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-indigo-600 transition-all shadow-lg">
                            Agendar Demo
                        </button>
                    </div>
                </div>
            </nav>
        `;

        const renderHero = () => `
            <header class="pt-40 pb-20 px-6">
                <div class="max-w-4xl mx-auto text-center reveal">
                    <span class="inline-block py-1.5 px-4 rounded-full bg-slate-100 text-slate-600 text-xs font-bold uppercase tracking-widest mb-6">
                        Para profesionales del sector premium
                    </span>
                    <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-slate-900 mb-8 leading-[1.1]">
                        ${CONFIG.hero.title}
                    </h1>
                    <p class="text-xl text-slate-500 leading-relaxed mb-10 max-w-2xl mx-auto">
                        ${CONFIG.hero.subtitle}
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button class="bg-slate-900 text-white px-10 py-5 rounded-2xl font-bold text-lg hover:shadow-2xl hover:-translate-y-1 transition-all">
                            ${CONFIG.hero.cta}
                        </button>
                    </div>
                </div>
            </header>
        `;

        const renderInventory = () => `
            <section id="catalogo" class="py-24 bg-slate-50">
                <div class="max-w-7xl mx-auto px-6">
                    <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6 reveal">
                        <div class="max-w-xl">
                            <h2 class="text-4xl font-bold text-slate-900 mb-4">Muestra de Portafolio</h2>
                            <p class="text-slate-500">Un vistazo a cómo tus productos cobran vida en nuestra plataforma. Sin distracciones, solo calidad.</p>
                        </div>
                        <div class="flex gap-2 bg-white p-1.5 rounded-2xl border border-slate-200">
                            <button class="px-6 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold">Todos</button>
                            <button class="px-6 py-2 rounded-xl hover:bg-slate-50 text-slate-500 text-sm font-bold transition-all">Propiedades</button>
                            <button class="px-6 py-2 rounded-xl hover:bg-slate-50 text-slate-500 text-sm font-bold transition-all">Vehículos</button>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-10">
                        ${CONFIG.inventory.map((item, idx) => `
                            <div class="reveal delay-${(idx % 2) * 200} showcase-card group bg-white rounded-[2.5rem] overflow-hidden border border-slate-100 shadow-sm">
                                <div class="aspect-[16/10] overflow-hidden relative">
                                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                                    <div class="absolute top-6 left-6 flex gap-2">
                                        ${item.tags.map(tag => `
                                            <span class="bg-white/90 backdrop-blur-md px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-900 shadow-sm">
                                                ${tag}
                                            </span>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="p-10">
                                    <div class="flex justify-between items-start mb-4">
                                        <h3 class="text-2xl font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">
                                            ${item.title}
                                        </h3>
                                        <button class="p-3 rounded-full border border-slate-100 hover:bg-slate-900 hover:text-white transition-all">
                                            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                    <p class="text-slate-500 text-lg leading-relaxed line-clamp-2">
                                        ${item.description}
                                    </p>
                                    <div class="mt-8 pt-8 border-t border-slate-50 flex justify-between items-center">
                                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">${item.category}</span>
                                        <span class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                                            Consultar disponibilidad <i data-lucide="message-circle" class="w-4 h-4"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </section>
        `;

        const renderCTA = () => `
            <section id="contacto" class="py-32 px-6">
                <div class="max-w-5xl mx-auto reveal">
                    <div class="bg-slate-900 rounded-[3rem] p-12 md:p-24 text-center relative overflow-hidden shadow-2xl">
                        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 24px 24px;"></div>
                        
                        <div class="relative z-10">
                            <h2 class="text-4xl md:text-6xl font-bold text-white mb-8 tracking-tight">${CONFIG.ctaSection.title}</h2>
                            <p class="text-xl text-slate-400 mb-12 max-w-2xl mx-auto">${CONFIG.ctaSection.subtitle}</p>
                            
                            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                <input type="email" placeholder="Email corporativo" class="px-8 py-5 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:w-80">
                                <button class="bg-white text-slate-900 px-10 py-5 rounded-2xl font-bold text-lg hover:bg-indigo-50 transition-all">
                                    Empezar ahora
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        `;

        const renderFooter = () => `
            <footer class="py-20 border-t border-slate-100 text-center">
                <div class="max-w-7xl mx-auto px-6">
                    <div class="flex items-center justify-center gap-2 mb-8">
                        <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white">
                            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-slate-900">${CONFIG.company.name}</span>
                    </div>
                    <div class="flex justify-center gap-10 mb-10">
                        <a href="#" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition-colors">Aviso Legal</a>
                        <a href="#" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition-colors">Privacidad</a>
                        <a href="#" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition-colors">Términos</a>
                    </div>
                    <p class="text-slate-400 text-sm font-medium">© 2024 Nova Showcase. Elevando los estándares del mercado secundario.</p>
                </div>
            </footer>
        `;

        function init() {
            const app = document.getElementById('app');
            app.innerHTML = `
                ${renderNav()}
                ${renderHero()}
                ${renderInventory()}
                ${renderCTA()}
                ${renderFooter()}
            `;

            lucide.createIcons();
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
