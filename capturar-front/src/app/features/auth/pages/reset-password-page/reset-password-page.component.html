<section class="auth-shell min-h-screen overflow-x-hidden text-slate-200">
  <div class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="auth-panel bg-darkCard/95 p-8 md:p-10 rounded-[2rem] shadow-2xl shadow-black/40 w-full max-w-md border border-darkBorder">
      <h1 class="text-2xl font-black mb-2 italic text-center">Nueva contrasena</h1>
      <p class="text-slate-500 text-sm text-center mb-8 font-medium">Crea una clave nueva para volver a tu panel</p>

      <form *ngIf="!isSuccess; else successState" (submit)="onSubmit($event)" class="space-y-5">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 px-1">Nueva contrasena</label>
          <input [(ngModel)]="newPassword" name="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimo 8 caracteres" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/5 transition font-medium">
          <p class="text-[11px] text-slate-500 mt-2 px-1">Debe tener al menos 8 caracteres, una letra y un numero.</p>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 px-1">Confirmar contrasena</label>
          <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeti la nueva contrasena" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/5 transition font-medium">
        </div>

        <p *ngIf="errorMessage" class="text-sm text-red-600 font-medium">{{ errorMessage }}</p>
        <button [disabled]="isLoading || !isFormValid" type="submit" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-500 transition shadow-xl shadow-blue-500/20 uppercase tracking-widest text-xs mt-4 disabled:opacity-60 disabled:cursor-not-allowed">
          {{ isLoading ? 'Guardando...' : 'Restablecer contrasena' }}
        </button>
      </form>

      <ng-template #successState>
        <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-emerald-800">
          <p class="text-sm font-bold">{{ successMessage }}</p>
        </div>
        <button (click)="goToLogin()" type="button" class="w-full mt-6 bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-500 transition shadow-xl shadow-blue-500/20 uppercase tracking-widest text-xs">
          Ir al ingreso
        </button>
      </ng-template>

      <a routerLink="/auth" class="block w-full mt-6 text-center text-sm text-blue-600 font-bold hover:underline">Volver al ingreso</a>
    </div>
  </div>
</section>
