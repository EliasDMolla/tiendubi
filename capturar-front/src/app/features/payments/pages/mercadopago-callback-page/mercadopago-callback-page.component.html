<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-black text-slate-900 mb-3">Conexión MercadoPago</h1>

    <p class="text-sm mb-6" [ngClass]="status === 'success' ? 'text-emerald-600' : 'text-red-600'">
      {{ message }}
    </p>

    <a
      routerLink="/panel/settings"
      class="inline-flex items-center justify-center rounded-xl bg-blue-700 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-600 transition"
    >
      Volver a Ajustes
    </a>
  </div>
</div>
