<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Tiendubi, tu link de venta</title>
  <desc id="description">Vendé por Instagram y WhatsApp desde un solo link.</desc>
  <defs>
    <linearGradient id="brand" x1="160" y1="500" x2="1010" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/><stop offset="0.55" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(860 170) rotate(140) scale(520 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity=".28"/><stop offset="1" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#080a10"/><rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(88 82)">
    <rect width="82" height="82" rx="22" fill="#111524" stroke="#292e45" stroke-width="2"/>
    <circle cx="25" cy="52" r="9" fill="url(#brand)"/><circle cx="57" cy="26" r="9" fill="url(#brand)"/>
    <path d="m32 46 17-14M46 21h16v16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="194" y="143" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="700">Tiendubi</text>
  <text x="88" y="285" fill="#fff" font-family="Arial, sans-serif" font-size="72" font-weight="800">Tu link vende por vos.</text>
  <text x="88" y="365" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="36">Cobrá, agendá y entregá desde un solo link.</text>
  <rect x="88" y="434" width="430" height="72" rx="20" fill="url(#brand)"/>
  <text x="122" y="481" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">tiendubi.com/tu-marca</text>
</svg>
