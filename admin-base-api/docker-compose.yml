services:
  tiendubi-webapi:
    container_name: tiendubi-webapi
    build:
      context: .
      dockerfile: Dockerfile
    image: tiendubi-webapi:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:8081"
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATA_PROTECTION_KEYS_PATH: /app/keys
    volumes:
      - tiendubi_webapi_keys:/app/keys

volumes:
  tiendubi_webapi_keys:
